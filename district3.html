<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quartier Society | District 3: Command Center</title>
    <!-- Connects to the central CSS mixer -->
    <!-------------------------------------------->
    <!--H2 1.1 GLOBAL STYLES (Master Bus)       -->
    <!-------------------------------------------->
    <link rel="stylesheet" href="css/global.css">
    <!--------------------------------------------->
    <!--H2 1.2 DISTRICT SPECIFIC STYLES          -->
    <!--------------------------------------------->
    <link rel="stylesheet" href="css/district3.css">

</head>
<body>
<header>

</header>    
<main class="district-content">
<!--=========================================-->
<!--H1 DISTRICT 3: THE COMMAND CENTER        -->
<!--=========================================-->
    <!------------------------------------------->
    <!--H2 3.1 THE BENTO GRID                  -->
    <!------------------------------------------->
    <section class="bento-wrapper">

        <!-- Module 1: Top Left -->
        <article class="bento-box box-metrics">
            <h3>System Metrics</h3>
            <!-- Telemetry Data Container -->
            <div class="metrics-panel">
                
                <div class="data-point">
                    <span class="data-label">Altitude</span>
                    <span class="data-value">1,450m</span>
                </div>
                
                <div class="data-point">
                    <span class="data-label">Core Temp</span>
                    <span class="data-value">37.2°C</span>
                </div>
                
                <div class="data-point">
                    <span class="data-label">Heart Rate</span>
                    <span class="data-value">115 BPM</span>
                </div>

            </div>
        </article>

        <!-- Module 2: Top Right -->
        <article class="bento-box box-tracker">
            <h3>1RM Tracker</h3>    
        </article>

        <!-- Module 3: Bottom Left -->
        <article class="bento-box box-logs">
            <h3>Recent Logs</h3>
        </article>
        
        <!-- Module 4: Bottom Right -->
        <article class="bento-box box-profile">
            <h3>Operator Status</h3>
        </article>

    </section>
</main>

<footer>

</footer>
    <script src="js/district3.js"></script>
</body>
</html>
